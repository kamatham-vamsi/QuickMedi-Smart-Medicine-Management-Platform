services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quickmedi
      MYSQL_USER: quickmedi
      MYSQL_PASSWORD: quickmedi
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://quickmedi:quickmedi@db:3306/quickmedi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
